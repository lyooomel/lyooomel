name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main], paths-ignore: [metrics.languages.svg] }

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/languages.py metrics.languages.svg
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - run: |
          git diff --quiet -- metrics.languages.svg && git ls-files --error-unmatch metrics.languages.svg >/dev/null 2>&1 && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.languages.svg
          git commit -m "Update language metrics"
          git push
